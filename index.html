
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nosso Discord</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0d14;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 450px;
  width: 100%;
  background: #171a26;
  padding: 35px 25px;
  border-radius: 20px;
  border: 1px solid #34384d;
}

.logo {
  font-size: 65px;
  margin-bottom: 10px;
}

h1 {
  font-size: 32px;
  margin: 10px 0;
}

p {
  color: #b9bdca;
  line-height: 1.6;
}

.button {
  display: block;
  background: #5865F2;
  color: white;
  text-decoration: none;
  padding: 17px;
  border-radius: 12px;
  font-weight: bold;
  margin-top: 25px;
  transition: 0.2s;
}

.button:hover {
  background: #4752c4;
  transform: scale(1.03);
}

.footer {
  color: #777d91;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">🎮</div>

  <h1>ENTRE PARA NOSSO DISCORD</h1>

  <p>
    Venha fazer parte da nossa comunidade!
    Conheça novas pessoas, converse e divirta-se.
  </p>

  <a class="button"
     href="https://discord.gg/JqddGHy8g"
     target="_blank">
     ENTRAR NO SERVIDOR
  </a>

  <div class="footer">
    Comunidade Discord
  </div>

</div>

</body>
</html>
